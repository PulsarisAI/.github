name: "Feature Request"
description: Create a new ticket for a feature request
title: "[FEATURE] <title>"
labels:
  - "feature"
  - "status:triage"

body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: Provide a brief explanation of the feature.
      placeholder: Describe your feature request in a few lines.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: Describe how the feature should work once implemented.
      placeholder: What should the system do? What is the expected outcome?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: How important is this feature?
      options:
        - 🟢Low
        - 🟡Medium
        - 🔴High
        - 🟣Critical
    validations:
      required: true

  - type: textarea
    id: unresolved_question
    attributes:
      label: "Unresolved Questions"
      description: What questions still remain unresolved?
      placeholder: Identify any open questions or uncertainties.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: Add any other context, links, screenshots, or references.
      placeholder: Optional supporting information.
    validations:
      required: false
